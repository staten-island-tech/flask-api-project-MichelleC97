<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>{{ spell.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container spell-detail">
    <h1>{{ spell.name }}</h1>
    <p><strong>Incantation:</strong> {{ spell.incantation }}</p>
    <p><strong>Effect:</strong> {{ spell.effect }}</p>
    <p><strong>Type:</strong> {{ spell.type }}</p>
    <p><strong>Light:</strong> {{ spell.light }}</p>
    <p><strong>Creator:</strong> {{ spell.creator }}</p>
    <p><strong>Can Be Verbal:</strong> {{ "Yes" if spell.canBeVerbal else "No" }}</p>
  </div>

    <a href="/" style="
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #f0c844;
        color: #6103a4;
        text-decoration: none;
        font-weight: bold;
        border-radius: 8px;
        box-shadow: 0 0 10px #00fbff;">
      ← Back to Home
    </a>
  </div>
</body>
</html>
